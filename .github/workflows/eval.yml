name: eval
on:
  workflow_dispatch:
    inputs:
      vol:
        description: "volume"
        default: "43"
      vues:
        description: "vues (ex. 31,38)"
        default: "31,38"
      models:
        description: "modèles comparés (clé=org/modèle[:faisceau])"
        default: "A=dh-unibe/trocr-kurrent-XVI-XVII,B=dh-unibe/trocr-kurrent,H=fgho/trocr-hanseXVII-kurrent"
permissions:
  contents: write
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-trocr-kurrent-v2
      - name: install
        run: |
          pip install -q torch==2.4.1 torchvision==0.19.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -q kraken==5.3.0 transformers==4.46.3 rapidfuzz opencv-python-headless requests sentencepiece
      - name: eval
        run: python run_chunk.py --vol ${{ github.event.inputs.vol }} --vues "${{ github.event.inputs.vues }}" --models "${{ github.event.inputs.models }}" --all-crops --out eval_out
      - name: commit
        if: always()
        run: |
          mkdir -p results/eval
          cp -r eval_out/* results/eval/ || true
          git config user.name "htr-bot"; git config user.email "htr-bot@users.noreply.github.com"
          git add results/eval
          git commit -m "eval ${{ github.event.inputs.vol }} ${{ github.event.inputs.vues }} run ${{ github.run_id }}" || echo "nothing"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep 10; done
